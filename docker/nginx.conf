# Single front door: serves the built single-page app and proxies the API.
# The browser only ever talks to this origin, so no CORS configuration is needed.

# Content-Security-Policy for the app itself. Not applied to /docs: Swagger UI loads scripts from a CDN.
#   - styles: 'unsafe-inline' because React/Motion set inline style attributes
#   - img-src data: because the avatars are generated in the browser as data URIs
map $uri $app_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    include /etc/nginx/security-headers.inc;

    # Container healthcheck, independent of the backend
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Interactive API documentation (own CSP-free headers: Swagger UI needs its CDN)
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change: cache them for a year
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Content-Security-Policy $app_csp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve the app shell, never cache it
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Content-Security-Policy $app_csp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
