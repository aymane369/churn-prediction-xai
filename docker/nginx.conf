server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container healthcheck, independent of the backend
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: same origin as the static files, so the browser needs no CORS configuration
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Interactive API documentation
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Until the frontend exists, say so instead of returning a bare 403
    location = / {
        try_files /index.html @placeholder;
    }

    location @placeholder {
        default_type text/plain;
        return 200 "Frontend not built yet. API documentation: /docs\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
