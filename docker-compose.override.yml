# Applied automatically by `docker compose up` (development conveniences: database and Redis reachable
# from tools on this computer). For front-end development run the Vite dev server instead of rebuilding
# the image:  cd frontend && API_URL=http://127.0.0.1:8080 npm run dev
# Skip it with:  docker compose -f docker-compose.yml up -d
services:
  # Bound to 127.0.0.1 so other machines on the network cannot reach the database or the
  # (password-less) Redis; only host-side tools on this computer can.
  db:
    ports:
      # 5433 on the host so it never clashes with a locally installed PostgreSQL on 5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
